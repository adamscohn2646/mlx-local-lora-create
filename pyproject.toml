[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-lora-create"
version = "0.2.0"
description = "LoRA preprocessing and training pipeline for MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "typer>=0.12",
    "mlx-vlm>=0.1.0",
    "mflux>=0.16.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocess*", "train*", "lora_test*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
