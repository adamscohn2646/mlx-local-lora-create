# Lilien caption batch — prompt v3 (instruction-leak fix)
# Same model and corpus as v2; outputs go to work/lilien/captions_v3/

project:
  name: lilien
  description: "Jugendstil style LoRA from the work of Ephraim Moshe Lilien"

paths:
  source_dir: "/path/to/your/dataset/EphraimMosheLilien"
  work_dir: "./work/lilien"
  output_dir: "./output/lilien"

quality_rules:
  min_short_side: 512
  preferred_short_side: 1024
  max_aspect_ratio: 2.0
  accepted_extensions: [".jpg", ".jpeg", ".png"]
  skipped_extensions: [".tif", ".tiff", ".svg"]
  require_rgb: true

captioning:
  vlm_model: "mlx-community/Qwen3-VL-4B-Instruct-8bit"
  vlm_params:
    temperature: 0.2
    top_p: 0.95
    top_k: 20
    max_tokens: 2048
    repetition_penalty: 1.0
    min_p: 0.0
    vlm_max_long_side: 1024
  artist_full_name: "Ephraim Moshe Lilien"
  artist_dates: "1874-1925"
  artist_origin: "Austro-Hungarian Jewish"
  style_tradition: "Jugendstil"
  medium_descriptor: "pen-and-ink illustration"
  trigger_phrase: "art by Ephraim Moshe Lilien, Jugendstil illustration,"
  prompt_version: v3
  medium_clause: >-
    black ink illustration on textured cream paper with visible grain,
    varying line weights, cross-hatching and stippling for shading,
    thin border when present
  prompt_target_word_count: 500
  caption_target_word_count: [85, 110]

img2img:
  enabled: false

output:
  format: "jpg"
  jpeg_quality: 95
  manifest_name: "manifest.jsonl"
